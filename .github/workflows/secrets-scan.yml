name: secrets-scan

# Layer 3 of the kb-driven secrets-scan defense (per docs/local/secrets-scan-design/).
# Re-runs the same scripts/secrets-scan.mjs as the local husky pre-commit hook (layer 2),
# acting as the server-side backstop if the hook was bypassed or absent.
#
# Note: the CI runner does NOT have access to the private watchlist directory, so kb-derived watchlist
# matches will be skipped. Only the structural regex (Windows/POSIX absolute paths,
# RFC1918 private IPs) runs on this side. Layer 2 catches kb-derived leaks locally;
# layer 4 (release skill) runs against the full kb on the release machine.

on:
  push:
    branches:
      - main
      - develop
      - 'hotfix/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  scan:
    name: scan tracked files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve exact public scanner package
        continue-on-error: true
        run: |
          if ! npm install --prefix "$RUNNER_TEMP/doxguard-ci" --ignore-scripts --include=optional --package-lock=false --no-save doxguard@0.2.0 > "$RUNNER_TEMP/doxguard-install.log" 2>&1; then
            echo 'Exact doxguard 0.2.0 package unavailable; dual gate will fail closed.'
            exit 1
          fi

      - name: Test strict native positive and negative controls
        if: ${{ !cancelled() }}
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DOXGUARD_PACKAGE_ROOT: ${{ runner.temp }}/doxguard-ci/node_modules/doxguard
        run: node scripts/secrets-scan.dual.mjs --controls

      - name: Test safe dual-scanner reporting
        if: ${{ !cancelled() }}
        run: node --test scripts/secrets-scan.dual.test.mjs scripts/secrets-scan.staged.test.mjs

      - name: Run legacy and strict public scans
        if: ${{ !cancelled() }}
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DOXGUARD_PACKAGE_ROOT: ${{ runner.temp }}/doxguard-ci/node_modules/doxguard
        run: node scripts/secrets-scan.dual.mjs --all-tracked
